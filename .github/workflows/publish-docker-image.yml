---
name: Build and publish docker image

on:
  workflow_dispatch:
    inputs:
      push_to_registry:
        type: boolean
        default: false
        description: Publish to registry?
      environment:
        type: environment
        description: Select the environment
  pull_request:
    branches:
      - 'develop'
      - 'releases/*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      should_push: ${{ steps.set-env.outputs.should_push }}
    steps:
      - name: Set Environment
        uses: wultra/wultra-infrastructure/.github/actions/set-env@issues/add-general-docker-workflow
        id: set-env
        with:
          PUSH_TO_REGISTRY: ${{ inputs.push_to_registry }}
          ENVIRONMENT: ${{ inputs.environment }}

  build:
    runs-on: 'ubuntu-latest'
    needs: set-environment
    environment: ${{ needs.set-environment.outputs.environment }}
    env:
      # these are global secrets
      INTERNAL_USERNAME: ${{ secrets.JFROG_USERNAME }}
      INTERNAL_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
      ACR_REGISTRY_URL: ${{ vars.ACR_REGISTRY_URL }}
      ACR_USERNAME: ${{ vars.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      DISTRIBUTION_REGISTRY_URL: ${{ vars.DISTRIBUTION_REGISTRY_URL }}
      DISTRIBUTION_USERNAME: ${{ vars.DISTRIBUTION_USERNAME }}
      DISTRIBUTION_PASSWORD: ${{ secrets.DISTRIBUTION_PASSWORD }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
    steps:
    - uses: actions/checkout@v6

    - name: Setup Java
      uses: wultra/wultra-infrastructure/.github/actions/setup-java@issues/add-general-docker-workflow

    - name: Install Cosign
      if: ${{ needs.set-environment.outputs.should_push == 'true' }}
      uses: wultra/wultra-infrastructure/.github/actions/install-cosign@issues/add-general-docker-workflow

    - name: Build Maven project
      uses: wultra/wultra-infrastructure/.github/actions/build-maven-docker@issues/add-general-docker-workflow
      id: build-maven
      with:
        APP_TO_BUILD: mobile-utility-server
        APP_CONTEXT: ''

    - name: Build and push Docker image
      uses: wultra/wultra-infrastructure/.github/actions/build-and-push-docker@issues/add-general-docker-workflow
      with:
        APP_TO_BUILD: mobile-utility-server
        APP_CONTEXT: ''
        APP_VERSION: ${{ steps.build-maven.outputs.APP_VERSION }}
        SHOULD_PUSH: ${{ needs.set-environment.outputs.should_push == 'true' }}
